name: regalia

services:
  player-service:
    build:
      context: .
      target: player-service
    volumes:
      - players-data:/data

  game-service:
    build:
      context: .
      target: game-service
    depends_on:
      - player-service
      - register-service
      - authentication-service
    volumes:
      - rooms-data:/data

  register-service:
    build:
      context: .
      target: register-service
    depends_on:
      - player-service
    volumes:
      - accounts-data:/data

  authentication-service:
    build:
      context: .
      target: authentication-service
    depends_on:
      - register-service
    restart: on-failure
    volumes:
      - accounts-data:/data

  nginx:
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    ports:
      - "127.0.0.1:${REGALIA_PORT:-8080}:80"
    environment:
      GAME_SERVICE_ORIGIN: "http://game-service:8081"
      NGINX_ENVSUBST_FILTER: "^GAME_SERVICE_ORIGIN$$"
    depends_on:
      - game-service
    volumes:
      - ./infrastructure/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./chess-frontend/src/main/resources/web:/usr/share/nginx/html:ro

volumes:
  players-data:
  rooms-data:
  accounts-data:
